name: Check game build

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test game logic
        run: node --test vk2/tests/core.test.js vk2/tests/can.test.js
      - name: Published copy must match the sources
        run: |
          python build_mod.py --base /bok/play --out play
          git add -A play
          git diff --cached --exit-code --stat play
