ã có cẩm nang truyện tranh dẫn đường.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.2.0</span><span class="rel-sum"><b>Công Pháp Nhập Thế</b><small>04/11/2026<!-- --> · <!-- -->2<!-- --> mục</small><span class="rel-lead">Thời của đánh thường đã hết. Từ nay mỗi đạo có bí kíp riêng: kiếm tu tung kiếm khí, đan tu ném đan hỏa, ma tu hút máu, phật tu dựng kim thân. Chiêu bạn luyện là chiêu bạn ra, trận nào cũng khác.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.1.0</span><span class="rel-sum"><b>Phường Thị Đổi Đời</b><small>03/11/2026<!-- --> · <!-- -->6<!-- --> mục</small><span class="rel-lead">Phường thị nay có giá theo phẩm, hàng mới về, hội đấu giá và thương nhân lưu động. Kết duyên và Hệ Thống có ích thật, còn người đã phi thăng thì có đồ tiên giới để săn.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.0.3</span><span class="rel-sum"><b>Thọ Nguyên Giữ Vững, Lời Viếng Có Tên</b><small>02/11/2026<!-- --> · <!-- -->5<!-- --> mục</small><span class="rel-lead">Đan dược thêm thọ không còn bị đột phá nuốt mất. Lời viếng ở Nghĩa trang nay nói đúng về người đã khuất, và Lôi đài cho đổi kiếp ra đài giữa các trận.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.0.2</span><span class="rel-sum"><b>Tích Cốc, Thiên Đạo Siết Tu Vi</b><small>31/10/2026<!-- --> · <!-- -->4<!-- --> mục</small><span class="rel-lead">Sau 4.0.1 đạo hữu lên Hóa Thần dễ quá, Thiên Đạo siết lại tu vi từ Kim Đan trở lên. Bù lại, từ Trúc Cơ đã tích cốc không còn chết đói, và tuổi 16 không còn là vách đá.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.0.1</span><span class="rel-sum"><b>Hết Chết Oan</b><small>30/10/2026<!-- --> · <!-- -->4<!-- --> mục</small><span class="rel-lead">Hai ngày sửa theo góp ý của đạo hữu: chết thì biết vì ai, tu cao thì phàm nhân phải tránh đường, kẻ thù không còn kéo tới ba trận liền. Hợp Hoan Tông cũng đã mở cửa.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">4.0.0</span><span class="rel-sum"><b>Vạn Kiếp Hộ Đạo</b><small>29/10/2026<!-- --> · <!-- -->4<!-- --> mục</small><span class="rel-lead">Bản này làm theo góp ý của đạo hữu: Chứng Đạo thành bốn kiếp vấn đạo và mười ba đạo lôi, các kiếp trước hiện về đỡ lôi thay bạn. Độ Kiếp có quái riêng, oan gia bớt dày, đồ thừa có chỗ dùng, được hạ chiến thư cho bóng của người khác.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">3.2.0</span><span class="rel-sum"><b>Phi Kiếm Luận Anh Hùng</b><small>27/10/2026<!-- --> · <!-- -->5<!-- --> mục</small><span class="rel-lead">Lôi đài giờ chỉ cần một ngón tay và 25 giây. Bóng mạnh nhất được thả vào giang hồ làm ma đầu. Đời nào đáng khoe thì có thẻ để khoe, dán link lên mạng là hiện hình nhân vật.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">3.1.1</span><span class="rel-sum"><b>Hoàn Hồn Đan</b><small>27/10/2026<!-- --> · <!-- -->3<!-- --> mục</small><span class="rel-lead">Đạo hữu nghiện quá mà hồn không theo kịp? Tiệm đan dưới chân cầu Nại Hà đã mở. Cùng lúc, Thiên Đạo cân lại đường tu: thọ dài hơn thì tu cũng phải chậm lại một chút.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">3.1.0</span><span class="rel-sum"><b>Vạn Tông Triều Bái</b><small>27/10/2026<!-- --> · <!-- -->9<!-- --> mục</small><span class="rel-lead">Bản này làm theo góp ý của đạo hữu. Thêm bốn tông môn, một con đường nhập Ma giới, mười cốt truyện cho người đã phi thăng, thọ nguyên dài hơn mà đột phá khó hơn, linh thạch không còn dễ như nhặt lá.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">3.0.0</span><span class="rel-sum"><b>Luân Hồi Đạo</b><small>26/10/2026<!-- --> · <!-- -->5<!-- --> mục</small><span class="rel-lead">Vạn kiếp luân hồi không còn là con đường tắt. Kẻ chết càng nhiều, Thiên đạo càng để mắt; linh hồn đầu thai dồn dập thì mòn đi. Muốn đi xa, phải biết nghỉ, biết quên, và biết đứng trên lôi đài.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">2.0.0</span><span class="rel-sum"><b>Vạn Mảnh</b><small>26/10/2026<!-- --> · <!-- -->5<!-- --> mục</small><span class="rel-lead">Bạn tưởng tiếng chuông đã im. Nhưng nó lại vang lên, lần này không đếm bạn mà đếm những người khác. Vạn Kiếp Chân Nhân không chỉ vỡ làm một mảnh là bạn. Và có kẻ vẫn đang gõ chuông.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">1.0.3</span><span class="rel-sum"><b>Tam Giới Khai Môn</b><small>26/10/2026<!-- --> · <!-- -->7<!-- --> mục</small><span class="rel-lead">Cửa trời đã mở. Phi thăng không còn là hồi kết: bên kia là Tiên giới, Ma giới và Thái Hư giới. Nhưng trước cửa trời, mỗi người phải đánh bại chính mình năm lần.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">1.0.2</span><span class="rel-sum"><b>Giang Hồ Ân Oán</b><small>25/10/2026<!-- --> · <!-- -->2<!-- --> mục</small><span class="rel-lead">Giang hồ không chỉ có một mình bạn. Ân phải trả, oán phải báo, và mỗi kiếp đều để lại một câu chuyện.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">1.0.1</span><span class="rel-sum"><b>Vạn Tượng Canh Tân</b><small>25/10/2026<!-- --> · <!-- -->2<!-- --> mục</small><span class="rel-lead">Thế giới khoác áo mới: nhân vật, quái, cảnh vật đều vẽ lại theo phong cách pixel LPC.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li><li><button class="rel-row "><span class="rel-ver">1.0.0</span><span class="rel-sum"><b>Khai Thiên</b><small>25/10/2026<!-- --> · <!-- -->1<!-- --> mục</small><span class="rel-lead">Vạn Kiếp Luân Hồi ra đời: một kiếp người, vạn con đường tu tiên.</span></span><span class="rel-go" aria-hidden="true">›</span></button></li></ol></main><!--$--><!--/$--><script id="_R_">(globalThis["TURBOPACK"] || (globalThis["TURBOPACK"] = [])).push({"otherChunks":["static/immutable/chunks/16bd_g2mlpshm.js","static/immutable/chunks/15fek726iepa0.js","static/immutable/chunks/1fq029h3adh94.js","static/immutable/chunks/0uv4jg5g9pfq8.js"],"runtimeModuleIds":[94553]});</script><script src="/bok/play/_next/static/immutable/chunks/16bd_g2mlpshm.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n4:\"/bok/play/_next/static/immutable/chunks/3hv4tg13vrxln.js\"\n5:\"/bok/play/_next/static/immutable/chunks/1z63ucwt6svgc.js\"\n6:I[39756,[\"$4\",\"$5\"],\"default\"]\n7:I[37457,[\"$4\",\"$5\"],\"default\"]\n9:I[47257,[\"$4\",\"$5\"],\"ClientPageRoot\"]\na:\"/bok/play/_next/static/immutable/chunks/1mb3-og7yn-_2.js\"\nb:\"/bok/play/_next/static/immutable/chunks/0dr7ab43jf4xx.js\"\nc:\"/bok/play/_next/static/immutable/chunks/3i9n5iv6t5q7t.js\"\nd:\"/bok/play/_next/static/immutable/chunks/0pcagq3015zh_.js\"\ne:I[7887,[\"$4\",\"$5\",\"$a\",\"$b\",\"$c\",\"$d\"],\"default\"]\nf:I[97367,[\"$4\",\"$5\"],\"OutletBoundary\"]\n10:\"$Sreact.suspense\"\n12:\"ViewportBoundary\"\n13:I[97367,[\"$4\",\"$5\"],\"$12\"]\n15:\"MetadataBoundary\"\n16:I[97367,[\"$4\",\"$5\"],\"$15\"]\n18:I[68027,[\"$4\",\"$5\"],\"default\",1]\n:HL[\"/bok/play/_next/static/immutable/chunks/3t4a--f6h8n0m.css\",\"style\"]\n8:[[\"children\",{\"s\":\"__PAGE__\",\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"ch
